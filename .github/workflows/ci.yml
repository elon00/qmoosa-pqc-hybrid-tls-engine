name: Hybrid Post-Quantum TLS Engine CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-hybrid-tls-engine

      - name: Checkout protocol repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-hybrid-tls-protocol
          ref: f2e2a73688849190ee231bf887a2dbcc29324eda
          path: qmoosa-pqc-hybrid-tls-protocol

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build protocol dependency
        run: |
          cd qmoosa-pqc-hybrid-tls-protocol
          npm ci
          npm run build

      - name: Install dependencies in engine
        run: |
          cd qmoosa-pqc-hybrid-tls-engine
          npm ci

      - name: Build TypeScript
        run: |
          cd qmoosa-pqc-hybrid-tls-engine
          npm run build

      - name: Run Engine Cryptographic Test Suite
        run: |
          cd qmoosa-pqc-hybrid-tls-engine
          npm test

      - name: Static Type & Lint Check
        run: |
          cd qmoosa-pqc-hybrid-tls-engine
          npm run lint
